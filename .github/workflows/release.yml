name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (for example 0.2.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      draft:
        description: Create the release as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not of the form 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

  build:
    needs: check
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, platform: windows/amd64 }
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v4

      - name: Set version in mygo.json
        run: perl -pi -e 's/("version"\s*:\s*")[^"]*"/${1}$ENV{VERSION}"/' mygo.json && cat mygo.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tests score hands with the bundled Windows Agari engine.
      - name: Test
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          go tool mygo vet .

      # Optional code signing: add WINDOWS_CERTIFICATE (a base64 .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD as repository secrets to sign the app,
      # the installer and its uninstaller. Without them builds are unsigned.
      - name: Prepare signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output 'No certificate: building unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_FILE=$pfx" >> $env:GITHUB_ENV

      # On Windows, mygo runs scripts/sign-windows.ps1 (windows.signCommand)
      # on the app before packing it, which applies the icon and signs when
      # it can, then builds the NSIS installer.
      - name: Build
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - name: Package portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem 'build/windows-amd64' | Where-Object Name -notlike '*-setup-*'
          Compress-Archive -Path $files.FullName -DestinationPath "build/riichi-studio-$env:VERSION-windows-amd64-portable.zip"

      - name: Remove signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Force (Join-Path $env:RUNNER_TEMP 'certificate.pfx') -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*.zip
            build/*/*-setup-*.exe
            build/*/*.dmg
            build/*/*.tar.gz
            build/*/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Commit version and tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          perl -pi -e 's/("version"\s*:\s*")[^"]*"/${1}$ENV{VERSION}"/' mygo.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain mygo.json)" ]; then
            git add mygo.json
            git commit -m "Release $TAG"
            git push origin "HEAD:$BRANCH"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=(--generate-notes --title "Riichi Studio $TAG")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          [ "$DRAFT" = true ] && flags+=(--draft)
          find dist -type f
          gh release create "$TAG" "${flags[@]}" $(find dist -type f)
